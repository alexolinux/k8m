[project]
name = "k8m"
version = "0.1.0"
description = "Real-time terminal monitor for Kubernetes Objects"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "kubernetes>=28.0",
    "rich>=13.0"
]

[project.scripts]
k8m = "k8m:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

